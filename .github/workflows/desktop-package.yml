name: 桌面安装包

# 桌面端 Windows / macOS 安装包(文档 18 Phase 7 验收:安装包在 Windows / macOS 可用)。
# 只做 workflow_dispatch 手动触发 + 制品上传:**不打 tag、不建 Release**——版本号只能由
# 用户手动给出并触发,验收测试未通过的二进制不作正式版本对外。Linux 腿一并跑,目的不是
# 产出 Linux 包,而是用同一 bundler 代码路径(图标/清单配置)在本腿快速兜住配置错误,
# 不必等 Windows / macOS 腿编译完才发现 tauri.conf.json 写错。
# 冒烟链:上传制品 → 裸产物 20s 进程存活 → 安装产物再跑 20s(验证安装包本身而非
# 裸二进制:Windows nsis /S / macOS dmg 挂载拷贝 / Linux dpkg -i)。制品先上传是因为
# 冒烟失败也要能取到安装包排障(制品不是 Release,红线见上)。
#
# nightly 模式(2026-10-20 加,口径见 .github 顶部红线注释):每日 schedule 一查,
# gate 比对 HEAD 与上次 nightly release 的 target 提交,没有新提交整链跳过(每日一查,
# 交付滞后上界 48 小时);三腿全绿才进 nightly-release job,删旧建新保持单一滚动
# nightly 预发布(--prerelease + --latest=false,不带版本号,永不占正式版本位)。
# 每日产物三件套(2026-10-21 用户令):桌面安装包(msi / nsis exe / dmg / deb / rpm)+
# 无界面 headless CLI(sandtable-linux-x64.tar.gz,同 workflow 另一 job),公开可下载、无需 PAT——
# Actions 制品下载
# 仍需凭据,拿不到本机二进制的真机走查只能走这条。默认手动触发(nightly 入参缺省)
# 行为不变:只出制品,不建 Release。
on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 发布滚动 nightly 预发布 Release(缺省只出制品)
        type: boolean
        default: false
  schedule:
    # UTC 14:23(北京 22:23),避开整点
    - cron: '23 14 * * *'

concurrency:
  group: desktop-package
  cancel-in-progress: true

jobs:
  # 调度触发的更新门:nightly 的 target 提交等于本次 HEAD 就没有更新,不重建
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      updated: ${{ steps.check.outputs.updated }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          last=$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || echo "")
          echo "last nightly target: ${last:-none}, head: $GITHUB_SHA"
          if [ -z "$last" ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: gate
    # always():手动触发时 gate 被 if 跳过,不能让跳过短路掉本 job;
    # 调度触发时 gate 判「无更新」也要跳过整条链
    if: always() && (needs.gate.result == 'skipped' || needs.gate.outputs.updated == 'true')
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 平台之间不互相拖:Windows / macOS 编译较慢,任一平台失败不中断其它平台
      fail-fast: false
      matrix:
        # 按平台出各自安装器(2026-10-21 用户令补 rpm;全局 bundle.targets 会让
        # Windows/macOS 无包可出——tauri.conf 不再写 targets,改由 --bundles 逐腿指定)
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm
          - os: windows-2025
            bundles: msi,nsis
          - os: macos-15
            bundles: dmg,app
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Linux 腿需要 webkit2gtk-4.1 头文件与运行库(与 test job 同一套 apt 包)
      - name: 安装 Linux 桌面依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # xvfb / openbox:安装包冒烟要起 X 服务(desktop-smoke job 同配方,见
          # ci.yml 该 job 的 apt 行;本 workflow 无其它步骤装这两个)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            xvfb openbox rpm

      # shell: bash 让 Windows / macOS 也走同一安装脚本(init.sh 自动挑平台二进制);
      # 首跑 macOS 腿曾因 runner 到 github.com 瞬时网络错(curl 28)失败,故带重试
      - name: 安装 wasm-pack(官方预编译)
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh -o /tmp/wasmpack-init.sh && sh /tmp/wasmpack-init.sh; then
              break
            fi
            [ "$i" = 3 ] && exit 1
            echo "wasm-pack installer attempt $i failed; retrying"; sleep 20
          done
          wasm-pack --version

      # tsc 要解析 sandtable-wasm 的 file:pkg 类型声明,须先出 pkg(与 web job 同序)
      - name: 构建 wasm pkg(release)
        run: wasm-pack build crates/sandtable-wasm --target web --release

      - name: 前端产物(npm run build)
        working-directory: apps/web
        env:
          # report.json 导出的环境字段(docs 22 绑定纪律):构建期注入 git_sha
          VITE_GIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      # custom-protocol 在编译期内嵌 frontendDist=web/dist,故前端产物须先行;
      # 未签名构建(拍板 2026-10-10:签名证书留到发布时再定)——Windows 不签名只影响
      # SmartScreen 首次打开体验,macOS 未签名需右键打开,均为首次安装提示非崩溃
      - name: 构建安装包
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          args: --bundles ${{ matrix.bundles }} --features custom-protocol

      # 制品而非 Release:未验收的二进制不进 Releases 页面。先于冒烟上传,
      # 冒烟失败也要能取到安装包排障
      - name: 上传安装包制品
        uses: actions/upload-artifact@v7
        with:
          name: sandtable-${{ runner.os }}-${{ github.run_number }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/app/*.app
            target/release/bundle/macos/*.app
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      # 冒烟一 · 裸产物(Windows / macOS 腿):直接拉起 target/release 里的二进制判
      # 「没死在启动链」——WebView2 / WKWebView 运行库缺失或窗口创建 panic 在此兜住;
      # Linux 腿不跑(desktop-smoke job 已有带截屏判定的完整启动链门,且下步 deb 冒烟
      # 直接覆盖)。二进制名见 deb 清单:sandtable-desktop(productName 只命名安装包)
      - name: 启动冒烟(裸产物 20s 进程存活)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target\release\sandtable-desktop.exe" -PassThru `
            -RedirectStandardError st-err.log -RedirectStandardOutput st-out.log
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Host "app exited early, code=$($p.ExitCode)"
            Get-Content st-err.log -ErrorAction SilentlyContinue
            Get-Content st-out.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "raw binary alive after 20s, pid=$($p.Id); killing"
          Stop-Process -Id $p.Id -Force

      - name: 启动冒烟(裸产物 20s 进程存活)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -e
          target/release/sandtable-desktop >/tmp/st-out.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "app exited early"; cat /tmp/st-out.log; exit 1
          fi
          echo "raw binary alive after 20s, pid=$pid; killing"
          kill "$pid"

      # 冒烟二 · 安装产物再跑(三平台):验证「安装包本身」而非只验证裸二进制——安装器
      # 解析失败 / 打包缺文件 / 安装后缺依赖在此兜住,与裸产物冒烟互为两段。
      - name: 安装包冒烟(安装后 20s 进程存活)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          # 两段安装器的顺序不能换:nsis 先装、msi 后装,且两段之间要清掉 nsis 写下的安装
          # 目录键。两个理由:一是 tauri-bundler 的 wxs 用 RegistrySearch 从
          # HKCU\Software\{manufacturer}\sandtable 取 INSTALLDIR 初值,而 nsis 装完经
          # WriteRegStr MANUPRODUCTKEY 把 $INSTDIR 写进同一个键——不清掉的话 msi 会直接装进
          # nsis 的目录同址覆盖,冒烟分不出两段各装了什么;二是不能反过来让 msi 先装,nsis
          # 模板的 wix_loop 会扫 HKLM 卸载表找到 msi 的条目而转入重装分支。
          # nsis 按 /S + /D= 定目录(同步跑完并给出退出码);msi 为 Tauri 默认
          # InstallScope=perMachine(装 Program Files,需提权;CI Windows runner 是管理员
          # 会话可直接装),退出码用 Start-Process -Wait -PassThru 取(直接调 msiexec 时
          # $LASTEXITCODE 为空判不了),0 成功、3010 成功但需重启,均算过。
          # 两段装同一二进制,出自同一 bundler 步骤
          # —— nsis 段(装完把安装目录写进 HKCU,故排在 msi 之前)——
          $nsis = (Get-ChildItem "target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue `
            | Select-Object -First 1).FullName
          if (-not $nsis) { Write-Host "no nsis exe found"; exit 1 }
          Write-Host "installing $nsis"
          $inst = Start-Process -FilePath $nsis -ArgumentList "/S", "/D=C:\st-install\" `
            -Wait -PassThru
          Write-Host "installer exit code: $($inst.ExitCode)"
          if ($inst.ExitCode -ne 0) { Write-Host "nsis install failed"; exit 1 }
          # 装目录:优先按 /D= 指定位置,退而读卸载注册表 / 搜每用户安装根
          $exe = $null
          $candidate = "C:\st-install\sandtable-desktop.exe"
          if (Test-Path $candidate) { $exe = $candidate }
          if (-not $exe) {
            $entry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" `
              -ErrorAction SilentlyContinue | Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "*sandtable*" } | Select-Object -First 1
            if ($entry -and $entry.InstallLocation) {
              $candidate = Join-Path $entry.InstallLocation "sandtable-desktop.exe"
              if (Test-Path $candidate) { $exe = $candidate }
            }
          }
          if (-not $exe) {
            $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse `
              -Filter "sandtable-desktop.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $exe) {
            Write-Host "installed exe not found; Programs tree:"
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -Recurse `
              -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "installed at $exe"
          $p = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardError st2-err.log -RedirectStandardOutput st2-out.log
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Host "installed app exited early, code=$($p.ExitCode)"
            Get-Content st2-err.log -ErrorAction SilentlyContinue
            Get-Content st2-out.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "installed app alive after 20s, pid=$($p.Id); killing"
          Stop-Process -Id $p.Id -Force

          # —— msi 段(排在 nsis 之后:nsis 模板的 wix_loop 见 msi 条目会转入重装分支)——
          # 先清掉 nsis 写下的安装目录键,让 msi 的 INSTALLDIR 落回模板默认
          # ProgramFiles64Folder\sandtable,而不是继承 nsis 的 C:\st-install
          Get-ChildItem "HKCU:\SOFTWARE" -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Where-Object { $_.PSChildName -like "*sandtable*" } |
            ForEach-Object { Remove-Item $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue }
          $msi = (Get-ChildItem "target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue `
            | Select-Object -First 1).FullName
          if (-not $msi) { Write-Host "no msi found"; exit 1 }
          Write-Host "installing $msi"
          $minst = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "msi-install.log" -Wait -PassThru
          Write-Host "msi installer exit code: $($minst.ExitCode)"
          if ($minst.ExitCode -ne 0 -and $minst.ExitCode -ne 3010) {
            Write-Host "msi install failed; log tail:"
            Get-Content msi-install.log -Tail 40 -ErrorAction SilentlyContinue
            exit 1
          }
          # 装点:msi 是 perMachine,Tauri 经 wxs 的 ARPINSTALLLOCATION 把安装目录写进卸载表
          # InstallLocation,先按注册表取(瞬时且权威),取不到再递归搜三个安装根;排除
          # st-install,避免把 nsis 段的副本当成本段产物
          $mexe = $null
          $app = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*", `
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*sandtable*" -and $_.InstallLocation -and
              $_.InstallLocation -notlike "*st-install*" } | Select-Object -First 1
          if ($app) {
            $candidate = Join-Path $app.InstallLocation "sandtable-desktop.exe"
            if (Test-Path $candidate) { $mexe = $candidate }
          }
          if (-not $mexe) {
            $mexe = (Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Recurse `
              -Filter "sandtable-desktop.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notlike "*st-install*" } |
              Select-Object -First 1).FullName
          }
          if (-not $mexe) {
            Write-Host "msi-installed exe not found; uninstall entries:"
            Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*", `
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "*sandtable*" } |
              Format-List DisplayName, InstallLocation, UninstallString, Version
            Write-Host "msi log path lines:"
            Get-Content msi-install.log -ErrorAction SilentlyContinue |
              Select-String -Pattern "INSTALLDIR|ProgramFiles|TARGETDIR" | Select-Object -First 15
            exit 1
          }
          Write-Host "msi installed at $mexe"
          $mp = Start-Process -FilePath $mexe -PassThru `
            -RedirectStandardError st3-err.log -RedirectStandardOutput st3-out.log
          Start-Sleep -Seconds 20
          if ($mp.HasExited) {
            Write-Host "msi-installed app exited early, code=$($mp.ExitCode)"
            Get-Content st3-err.log -ErrorAction SilentlyContinue
            Get-Content st3-out.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "msi-installed app alive after 20s, pid=$($mp.Id); killing"
          Stop-Process -Id $mp.Id -Force


      - name: 安装包冒烟(安装后 20s 进程存活)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -eo pipefail
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          [ -n "$dmg" ] || { echo "no dmg found"; exit 1; }
          echo "attaching $dmg"
          # -mountpoint 固定挂载点:免解析 hdiutil 输出(-quiet 会吞掉挂载行)
          mnt=/tmp/st-dmg
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mnt"
          echo "mounted at $mnt"
          mkdir -p /tmp/st-install
          cp -a "$mnt"/*.app /tmp/st-install/
          hdiutil detach "$mnt" -quiet
          app=$(ls -d /tmp/st-install/*.app | head -1)
          [ -n "$app" ] || { echo "no .app in dmg"; exit 1; }
          bin=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -1)
          [ -n "$bin" ] || { echo "no executable in $app"; exit 1; }
          echo "running installed $bin"
          "$bin" >/tmp/st2-out.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "installed app exited early"; cat /tmp/st2-out.log; exit 1
          fi
          echo "installed app alive after 20s, pid=$pid; killing"
          kill "$pid"

      - name: 安装包冒烟(安装后 20s 进程存活)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -e
          deb=$(ls target/release/bundle/deb/*.deb | head -1)
          [ -n "$deb" ] || { echo "no deb found"; exit 1; }
          pkg=$(dpkg-deb -f "$deb" Package)
          echo "installing $deb (package $pkg)"
          sudo dpkg -i "$deb"
          bin=$(dpkg -L "$pkg" | grep -m1 '/sandtable-desktop$')
          [ -n "$bin" ] || { echo "sandtable-desktop not in deb contents"; exit 1; }
          # GTK 后端要显示服务:runner 无 X,起 Xvfb(与 desktop-smoke job 同配方);
          # WebKitGTK 在 Xvfb 下须关两个渲染器才落 X 像素
          command -v Xvfb >/dev/null || { echo "Xvfb missing"; exit 1; }
          Xvfb :96 -screen 0 1280x800x24 >/dev/null 2>&1 &
          xvfb_pid=$!
          # X socket 就绪前拉起会直接 gtk backend 初始化失败(desktop_smoke.sh 同序)
          sleep 2
          export DISPLAY=:96
          export WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
          echo "running installed $bin"
          "$bin" >/tmp/st2-out.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "installed app exited early"; cat /tmp/st2-out.log; exit 1
          fi
          echo "installed app alive after 20s, pid=$pid; killing"
          kill "$pid"
          kill "$xvfb_pid" 2>/dev/null || true

  # 无界面 headless CLI(2026-10-21 用户令:每日构建不只要桌面,还要不带界面的版本)。
  # 不依赖 web/wasm/桌面栈,纯 cargo 构建 sandtable 二进制;Linux x64 先行(舰队 runner 同构),
  # 冒烟 --version/--help 出门;打包 tar.gz+sha256 上传,并进 nightly 滚动 Release。
  cli-headless:
    needs: gate
    if: always() && (needs.gate.result == 'skipped' || needs.gate.outputs.updated == 'true')
    name: headless CLI (linux-x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建 release CLI
        run: cargo build --release -p sandtable-cli

      - name: 冒烟(--version / --help)
        run: |
          set -e
          ./target/release/sandtable --version
          ./target/release/sandtable --help | head -5
          # 无界面保证:裸二进制不拉起任何窗口(纯 CLI,超时 15s 内退出即算过)
          timeout 15 ./target/release/sandtable --help >/dev/null

      - name: 打包 tar.gz + sha256
        run: |
          set -e
          stage=$(mktemp -d)
          cp target/release/sandtable "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          tar -czf "sandtable-cli-linux-x64-${GITHUB_SHA::8}.tar.gz" -C "$stage" .
          sha256sum "sandtable-cli-linux-x64-${GITHUB_SHA::8}.tar.gz" > "sandtable-cli-linux-x64-${GITHUB_SHA::8}.tar.gz.sha256"
          ls -la sandtable-cli-*

      - name: 上传 headless CLI 制品
        uses: actions/upload-artifact@v7
        with:
          name: sandtable-cli-linux-x64-${{ github.run_number }}
          path: |
            sandtable-cli-linux-x64-*.tar.gz
            sandtable-cli-linux-x64-*.tar.gz.sha256
          if-no-files-found: error

  # nightly 滚动发布:三腿构建+安装冒烟全绿才走到这里。删旧建新保持单一滚动 Release;
  # --prerelease + --latest=false 永不占正式版本位,正式版本仍只能由用户手动给出并触发
  nightly-release:
    needs: [package, cli-headless]
    if: >-
      always() && needs.package.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.nightly == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sandtable-*
          merge-multiple: true
          path: dist
      - name: 发布滚动 nightly(预发布)
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 无 checkout(省一步下载源码),gh 需要 GH_REPO 指明目标仓库,
          # 否则报 failed to run git: not a git repository
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # download-artifact 保留制品内部目录(bundle/msi、bundle/nsis 等),发布只取安装器、
          # 不收 .app 目录;用 find 收平层 glob 会漏配(no matches found 即整步失败)
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find dist -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*.rpm' -o -name 'sandtable-cli-*.tar.gz' \) -print0)
          [ "${#files[@]}" -gt 0 ] || { echo "no installer found"; exit 1; }
          printf '%s\n' "${files[@]}"
          sha8="${GITHUB_SHA::8}"
          notes="滚动每日构建(检测到更新才发布),commit ${sha8},出自 run ${{ github.run_id }}。预发布:未走完整验收,仅用于真机走查与冒烟排障;正式版本由用户手动触发。"
          if gh release view nightly >/dev/null 2>&1; then
            # 竞态根治: 已存在即 clobber 覆盖上传,绝不删 Release(连发互删曾致资产空)
            gh release upload nightly "${files[@]}" --clobber
            gh release edit nightly --title "nightly ${sha8}" --notes "$notes" 2>/dev/null || true
          else
            gh release create nightly \
              --title "nightly ${sha8}" \
              --notes "$notes" \
              --prerelease --latest=false \
              --target "$GITHUB_SHA" \
              "${files[@]}"
          fi
          # GitHub 曾把 workflow 建的发布留成 draft(公网 404 不可见)——强制转正兜底
          gh release edit nightly --draft=false 2>/dev/null || true
          echo "nightly release published at commit ${sha8}"
