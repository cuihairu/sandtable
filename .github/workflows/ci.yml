name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Phase 7(文档 18 章):桌面壳(Tauri 2)Linux 编译门,拍板 2026-10-10 本机先行
      # 脚本层阶段 1(scripts/scripting-design.md):python3-dev 供 sandtable-python 测试链接 libpython
      - name: 安装 Linux 桌面依赖(webkit2gtk-4.1)与 Python 头文件
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libglib2.0-dev python3-dev

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试(含解析解、确定性、黄金快照、桌面命令面)
        run: cargo test --workspace

      # 架构红线(文档 04 章):核心必须保持纯 Rust,Phase 1 起持续可编译 WASM
      - name: WASM 编译门
        run: cargo check -p sandtable-core --target wasm32-unknown-unknown

      # Phase 6(文档 18 章):wasm 绑定可构建出 pkg(核心在 wasm32 下完整可用)
      - name: 安装 wasm-pack(官方预编译)
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: WASM 绑定构建门
        run: |
          wasm-pack build crates/sandtable-wasm --target web --dev
          test -f crates/sandtable-wasm/pkg/sandtable_wasm_bg.wasm

      # Phase 2(文档 09 章):Arrow / Parquet 导出以 feature 提供,默认构建不含
      - name: Arrow/Parquet feature 门
        run: |
          cargo check -p sandtable-core --features arrow
          cargo check -p sandtable-core --target wasm32-unknown-unknown --features arrow
          cargo test -p sandtable-cli --features parquet

      # Phase 3(文档 09 章):DuckDB 分析层以 feature 提供,bundled 静态构建
      - name: DuckDB feature 门
        run: |
          cargo check -p sandtable-cli --features duckdb
          cargo test -p sandtable-cli --features duckdb,parquet

      # 脚本层阶段 2(scripts/scripting-design.md):编排模板语法门(不建 wheel,拍板④维持挂起)
      - name: Python 模板语法检查
        run: python3 -m py_compile scripts/templates/*.py

      - name: 冒烟(1 万玩家 × 30 天 + A/B + 扫描 + 推荐 + 报告)
        run: |
          cargo build --release
          ./target/release/sandtable validate --players 10000 --days 30
          ./target/release/sandtable simulate --players 10000 --days 30 --out /tmp/smoke
          ./target/release/sandtable compare --replicates 4 --players 2000 --days 14 --out /tmp/ab
          cat > /tmp/exp.yaml <<'YAML'
          schema_version: "1"
          scenario: {population: 500, duration: "10d"}
          sweep:
            replicates: 2
            parameters:
              model.warrior.attack: {min: 90, max: 110, step: 10}
            targets:
              - {metric: win_rate, min: 0.0, max: 1.0}
          YAML
          ./target/release/sandtable sweep /tmp/exp.yaml --out /tmp/sweep
          ./target/release/sandtable recommend /tmp/exp.yaml /tmp/sweep --out /tmp/sweep/rec.json
          ./target/release/sandtable report /tmp/smoke /tmp/sweep /tmp/ab --out /tmp/report.html
          grep -q "<svg" /tmp/report.html

  web:
    name: Web 构建(wasm + 前端)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Phase 6(文档 18 章):绑定 pkg 先行,前端类型对齐 + 打包即门禁
      - name: 安装 wasm-pack(官方预编译)
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: 构建 wasm pkg(release)
        run: |
          wasm-pack build crates/sandtable-wasm --target web --release
          test -f crates/sandtable-wasm/pkg/sandtable_wasm_bg.wasm

      - name: 前端构建(类型检查 + 打包)
        working-directory: apps/web
        env:
          # report.json 导出的环境字段(docs 22 绑定纪律):构建期注入 git_sha
          VITE_GIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build
          ls dist/assets/*.wasm >/dev/null

      # 前端守卫(2026-10-13 宝可梦预设漂移 + WebKit ToBigInt 崩溃):
      # 预设必须过真实内核 validate(需 pkg-node);列式化 BigInt 归一为纯函数守卫;
      # 项目打包/解包闭环 + 路径纪律(打包产物过真实内核 validate)
      - name: 前端守卫(node --test)
        run: |
          # 不依赖 wasm pkg 的套件先跑;需要 pkg-node 的测试必须在下面 wasm-pack
          # nodejs 构建之后(experiment-form 曾错列在此组,全新 checkout 无 pkg-node)
          node --test apps/web/tests/columns.test.mjs apps/web/tests/tokens.test.mjs apps/web/tests/workbench-ids.test.mjs apps/web/tests/workbench-logic.test.mjs apps/web/tests/i18n.test.mjs apps/web/tests/params-config.test.mjs apps/web/tests/sweep-view.test.mjs apps/web/tests/machine-export.test.mjs apps/web/tests/execution.test.mjs apps/web/tests/workbench-store.test.mjs apps/web/tests/workbench-shortcuts.test.mjs apps/web/tests/workbench-locale.test.mjs apps/web/tests/data-workspace.test.mjs apps/web/tests/flow-multi-config.test.mjs
          wasm-pack build crates/sandtable-wasm --target nodejs --out-dir pkg-node --dev
          # 依赖 pkg-node 的套件(sandtable_wasm.js 由上一步构建)
          node --test apps/web/tests/presets.test.mjs apps/web/tests/project.test.mjs apps/web/tests/contracts.test.mjs apps/web/tests/execution-kernel.test.mjs apps/web/tests/ab-parity.test.mjs apps/web/tests/experiment-form.test.mjs apps/web/tests/flow-loop.test.mjs apps/web/tests/flow-run-interrupt.test.mjs apps/web/tests/flow-adopt-rerun.test.mjs apps/web/tests/error-surface.test.mjs apps/web/tests/export-roundtrip.test.mjs apps/web/tests/flow-bilingual.test.mjs apps/web/tests/locale-inert.test.mjs apps/web/tests/flow-channels.test.mjs apps/web/tests/flow-interaction.test.mjs
          node --test apps/web/tests/analysis-results.test.mjs

  # 桌面启动链守卫(2026-10-13 接入):无 custom-protocol 的构建是开发形态——窗口
  # 加载 build.devUrl(localhost:5173),独立运行只显示错误页;这个坑此前只被
  # 人工验收清单挡过,无自动化门。scripts/desktop_smoke.sh 在本机实测的配方
  # (Xvfb + openbox + 关 DMABUF/合成渲染器 + resize 重试)升为 CI 门:进程存活
  # 且截屏色数达标(空白窗 <100 色即 fail),debug 构建提速。
  # 判据按「窗口是否真上屏 + 截到的是否 RGB 像素」分级,别把环境问题报成白屏
  # (2026-10-20 run 39412546114:主窗要启动后 ~32 秒才创建,旧的 15+24 秒预算
  # 采到的是空桌面,1 色被误判 webview 未绘制)。
  desktop-smoke:
    name: 桌面无头冒烟(启动链)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # webkit2gtk dev 包一并带来运行库(与 test job 同一镜像已验过);
      # xvfb/openbox/xdotool/imagemagick 为冒烟配方依赖,x11-utils 提供
      # xwininfo——冒烟用它核对显示深度与窗口映射态,把「空桌面/没上屏」和
      # 「上屏了但空白」分开报(2026-10-20 run 39412546114 误报空白窗)
      - name: 安装桌面依赖与冒烟工具
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            xvfb openbox xdotool imagemagick x11-utils

      # custom-protocol 在编译期内嵌 frontendDist=web/dist,前端产物须先行;
      # tsc 要解析 sandtable-wasm 的 file:pkg 类型声明,须先出 pkg(首跑 2026-10-13
      # 翻红即漏了这步:Cannot find module 'sandtable-wasm')
      - name: 安装 wasm-pack(官方预编译)
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: 构建 wasm pkg(dev,smoke 不走 wasm 路径,类型与打包够用)
        run: wasm-pack build crates/sandtable-wasm --target web --dev

      - name: 前端产物(npm run build)
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: 无头冒烟(构建 + Xvfb 拉起 + 截屏判定)
        run: ST_SMOKE_PROFILE=debug bash scripts/desktop_smoke.sh

      # 冒烟翻红时把现场(截图/启动日志)带走,色数与白屏问题没图没法诊断
      - name: 上传冒烟现场(仅失败时)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-evidence
          path: |
            /tmp/sandtable_desktop_smoke.png
            /tmp/sandtable_desktop_smoke.log
          if-no-files-found: ignore
