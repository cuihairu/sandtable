name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Phase 7(文档 18 章):桌面壳(Tauri 2)Linux 编译门,拍板 2026-10-10 本机先行
      # 脚本层阶段 1(scripts/scripting-design.md):python3-dev 供 sandtable-python 测试链接 libpython
      - name: 安装 Linux 桌面依赖(webkit2gtk-4.1)与 Python 头文件
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libglib2.0-dev python3-dev

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试(含解析解、确定性、黄金快照、桌面命令面)
        run: cargo test --workspace

      # 架构红线(文档 04 章):核心必须保持纯 Rust,Phase 1 起持续可编译 WASM
      - name: WASM 编译门
        run: cargo check -p sandtable-core --target wasm32-unknown-unknown

      # Phase 6(文档 18 章):wasm 绑定可构建出 pkg(核心在 wasm32 下完整可用)
      - name: 安装 wasm-pack(官方预编译)
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: WASM 绑定构建门
        run: |
          wasm-pack build crates/sandtable-wasm --target web --dev
          test -f crates/sandtable-wasm/pkg/sandtable_wasm_bg.wasm

      # Phase 2(文档 09 章):Arrow / Parquet 导出以 feature 提供,默认构建不含
      - name: Arrow/Parquet feature 门
        run: |
          cargo check -p sandtable-core --features arrow
          cargo check -p sandtable-core --target wasm32-unknown-unknown --features arrow
          cargo test -p sandtable-cli --features parquet

      # Phase 3(文档 09 章):DuckDB 分析层以 feature 提供,bundled 静态构建
      - name: DuckDB feature 门
        run: |
          cargo check -p sandtable-cli --features duckdb
          cargo test -p sandtable-cli --features duckdb,parquet

      - name: 冒烟(1 万玩家 × 30 天 + A/B + 扫描 + 推荐 + 报告)
        run: |
          cargo build --release
          ./target/release/sandtable validate --players 10000 --days 30
          ./target/release/sandtable simulate --players 10000 --days 30 --out /tmp/smoke
          ./target/release/sandtable compare --replicates 4 --players 2000 --days 14 --out /tmp/ab
          cat > /tmp/exp.yaml <<'YAML'
          schema_version: "1"
          scenario: {population: 500, duration: "10d"}
          sweep:
            replicates: 2
            parameters:
              model.warrior.attack: {min: 90, max: 110, step: 10}
            targets:
              - {metric: win_rate, min: 0.0, max: 1.0}
          YAML
          ./target/release/sandtable sweep /tmp/exp.yaml --out /tmp/sweep
          ./target/release/sandtable recommend /tmp/exp.yaml /tmp/sweep --out /tmp/sweep/rec.json
          ./target/release/sandtable report /tmp/smoke /tmp/sweep /tmp/ab --out /tmp/report.html
          grep -q "<svg" /tmp/report.html

  web:
    name: Web 构建(wasm + 前端)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Phase 6(文档 18 章):绑定 pkg 先行,前端类型对齐 + 打包即门禁
      - name: 安装 wasm-pack(官方预编译)
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: 构建 wasm pkg(release)
        run: |
          wasm-pack build crates/sandtable-wasm --target web --release
          test -f crates/sandtable-wasm/pkg/sandtable_wasm_bg.wasm

      - name: 前端构建(类型检查 + 打包)
        working-directory: apps/web
        env:
          # report.json 导出的环境字段(docs 22 绑定纪律):构建期注入 git_sha
          VITE_GIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build
          ls dist/assets/*.wasm >/dev/null
