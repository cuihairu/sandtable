[package]
name = "sandtable-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sandtable desktop shell (Tauri 2, Linux first)"

[lib]
name = "sandtable_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 缺省(无 custom-protocol)= 开发形态:窗口加载 build.devUrl(localhost:5173);
# 加上才走 frontendDist 内联资产(独立二进制)。无 tauri CLI 的直编路径:
#   cargo build --release -p sandtable-desktop --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
sandtable-core = { path = "../../../crates/sandtable-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# 前端「本地结果文件分析」面板经 dialog 插件选文件(官方一等插件,同 2.x 线)
tauri-plugin-dialog = "2"
# 本地分析层(拍板 2026-10-10 复用 duckdb-rs):只读结果数据集,
# 与 CLI query 子命令同源;前端查询层继续 duckdb-wasm(同一前端零改动)
duckdb = { version = "1", default-features = false, features = ["bundled", "parquet"] }

[dev-dependencies]
# 桌面等价验收:与 wasm 绑定同配置同 seed 逐值一致(web_parity 已锁 wasm↔CLI)
sandtable-wasm = { path = "../../../crates/sandtable-wasm" }
# 长任务命令层测试:mock_app 免窗口起 App,State/Channel 走真实命令路径
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
