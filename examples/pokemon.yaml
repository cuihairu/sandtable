# 真实配置验证案例:宝可梦(第一世代关都八道馆)数值接入 sandtable 模型。
# 映射方法、换算式与阻力清单见 docs/guide/21-pokemon-case.md;本文件注释只标来源。
schema_version: '1'

scenario:
  population: 10000
  duration: 30d
  seed: 12345
  population_mix: # sandtable 假设层(宝可梦无分群概念)
    casual: 0.6
    core: 0.3
    whale: 0.1

model:
  # 玩家实体 = 初始宝可梦(Charizard 78/84/78 种族值,Pokédex)。
  # 能力公式:HP = floor(2B·L/100)+L+10,其他 = floor(2B·L/100)+5。
  # 以名义 L14 起步(模型无野怪练级环,取首馆 Brock 的常规到访等级;阻力清单 #4),
  # 全局 ×5 缩放到 sandtable 数值域:
  #   atk = floor(2*84*14/100)+5 = 28,def = floor(2*78*14/100)+5 = 26,hp = 45
  warrior:
    attack: 140
    defense: 130
    hp: 225

  combat:
    # 宝可梦伤害随机系数 85%~100%,取中值 0.925 表达命中/浮动结构
    p_hit: 0.95
    p_hit_monster: 0.95
    # ±7.5% 相对满幅 → ×5 后绝对半宽 ≈ 7(t0 伤害 74 ± 6,t7 ± 8,取整)
    dmg_var: 7
    max_rounds: 32

  dungeon:
    # 关都八道馆 → 八层;tier t = 第 t 馆 ace 同级挑战(pokered parties.asm 逐馆等级)
    tiers: 8
    # —— 几何推导参数(逐层表给出时不参与;保留作 tier0 锚点与战力口径备查)——
    # tier0 = Brock 的 Onix @ L14(HP 33)×5;攻防为差值等效换算(docs 21):
    #   m_defense = 玩家 L14 攻 − 比值模型期望伤害 ×5 = 140 − 79 = 61
    #   m_attack  = 玩家 L14 防 + 被击期望 ×5 = 130 + 89 = 219
    m_hp: 165
    m_attack: 219
    m_defense: 61
    # 综合战力(atk*2+def+hp/10)口径 t0→t7 几何拟合:(515.5→1666.5)^(1/7) ≈ 1.18
    tier_growth: 1.18
    # —— 逐层显式表(docs 21 阻力 #3 根治)——
    # 每馆 ace 等级(pokered)× 图鉴种族值(Pokédex)× 差值等效换算(docs 21 公式),
    # 三维锯齿形状逐格表达(防御 61→65→34→97→276→144→268→332);
    # 行内 gold / xp 缺省 → 回退下方锚点几何
    tier_table:
      - { hp: 165, attack: 219, defense: 61 }   # Onix @14
      - { hp: 280, attack: 314, defense: 65 }   # Starmie @21
      - { hp: 310, attack: 359, defense: 34 }   # Raichu @24
      - { hp: 425, attack: 418, defense: 97 }   # Victreebel @29
      - { hp: 540, attack: 510, defense: 276 }  # Weezing @43
      - { hp: 500, attack: 453, defense: 144 }  # Alakazam @43
      - { hp: 705, attack: 572, defense: 268 }  # Arcanine @47
      - { hp: 825, attack: 626, defense: 332 }  # Rhydon @50
    # 首馆奖金 ¥1,400(RB),1:1 锚定(消费环是假设层,不缩放)
    reward_gold: 1400
    # Gen1 经验 yield = floor(base_exp × level / 7);Onix base 108 → L14 = 216,×5
    reward_xp: 1080
    # 双增长率(docs 21 阻力 #2 根治):奖金 (7000/1400)^(1/7) ≈ 1.26,
    # 经验 (1457/216)^(1/7) ≈ 1.31(首馆锚点 + 末馆端点定形,中段按几何)
    reward_gold_growth: 1.26
    reward_xp_growth: 1.31

  behavior: # sandtable 假设层,维持默认(宝可梦无会话结构)
    casual: { p_dungeon: 0.7, p_upgrade: 0.2, sessions_frac: 0.5, sessions_int: 1 }
    core: { p_dungeon: 0.6, p_upgrade: 0.3, sessions_frac: 0.5, sessions_int: 2 }
    whale: { p_dungeon: 0.65, p_upgrade: 0.3, sessions_frac: 0, sessions_int: 5 }

  progression:
    # Medium Fast 曲线:升下一级需 3L²−3L+1 ≈ 3L²(Bulbapedia Experience),
    # 幂律拟合 xp_base·L^2.0;×5 与能力值同域 → 15·L²
    xp_base: 15
    xp_pow: 2.0
    # 每级增量 = B/50(HP 再 +1):HP 2.56→13,Atk 1.68→8,Def 1.56→8(×5 取整)
    level_attack_gain: 8
    level_defense_gain: 8
    level_hp_gain: 13
    # 强化链是 sandtable 消费假设层(宝可梦无金币回收环),维持默认定价
    upgrade_cost_base: 50
    upgrade_cost_num: 5
    upgrade_cost_den: 4
    upgrade_attack_gain: 2

  churn: # sandtable 假设层(卡关流失的 analog:打不动馆主 = 停滞)
    p_base: 0.003
    p_stall: 0.05
    stall_days: 2
