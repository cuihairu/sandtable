# 真实配置验证案例:宝可梦(第一世代关都八道馆)数值接入 sandtable 模型。
# 映射方法与阻力清单见 docs/guide/21-pokemon-case.md;本文件注释只标来源。
schema_version: '1'

scenario:
  population: 10000
  duration: 30d
  seed: 12345
  population_mix: # sandtable 假设层(宝可梦无分群概念)
    casual: 0.6
    core: 0.3
    whale: 0.1

model:
  # 玩家实体 = 初始宝可梦(Charizard 78/84/78 种族值,Pokédex)。
  # 能力公式:HP = floor(2B·L/100)+L+10,其他 = floor(2B·L/100)+5。
  # L1 真起步(阻力清单 #4 根治):练级产出面把玩家从 L1 带到首馆可战等级,
  # 不再需要"名义 L14 起步"的 workaround;全局 ×5 缩放到 sandtable 数值域:
  #   atk = floor(2*84*1/100)+5 = 6,def = floor(2*78*1/100)+5 = 6,hp = 12
  warrior:
    attack: 30
    defense: 30
    hp: 60

  combat:
    # 比值口径(阻力 #1 根治):宝可梦伤害公式是比值模型,直抄不再做差值等效换算。
    # ratio_k 标定:Gen1 L50 威力 60 期望伤害 ((2L/5+2)·60·A/D/50 + 2),随机取中值
    # 0.925,×5 域下 A/D=1 锚点 ≈ 131 → k = 2×131 ≈ 262,取 260(配置可读,
    # 同全局 ×5 的取整先例;比例结构在锚点对齐,非线性项不逐位等价)
    damage_model: ratio
    ratio_k: 260
    # 宝可梦伤害随机系数 85%~100%,取中值 0.925 表达命中/浮动结构
    p_hit: 0.95
    p_hit_monster: 0.95
    # ±7.5% 相对满幅 → ×5 后绝对半宽 ≈ 7
    dmg_var: 7
    max_rounds: 32

  training:
    # 练级产出面(阻力 #4 根治):野怪练级的 sandtable 类比——非 dungeon 的练级带。
    # 一次练级带聚合一 session 的野怪遭遇(原作单只 yield 太小,30 天节奏对不上):
    #   xp ≈ 300(约单次野怪遭遇 ×20、首馆 yield 1080 的 27%),
    #   gold ≈ 100(≈ 首馆奖金 1400 的 7%,原作野怪不给钱的类比)。
    # 数值为假设层,按 30 天节奏标定(玩家 L1→首馆可战 ≈ 十来天,见 docs 21)。
    xp: 300
    gold: 100

  dungeon:
    # 关都八道馆 → 八层;tier t = 第 t 馆 ace 同级挑战(pokered parties.asm 逐馆等级)
    tiers: 8
    # —— 几何推导参数(逐层表给出时不参与;保留作 tier0 锚点与战力口径备查)——
    # tier0 = Brock 的 Onix @ L14 ×5,攻防直抄能力值(docs 21:比值口径根治后换算层删除):
    #   atk = floor(2*45*14/100)+5 = 17,def = floor(2*160*14/100)+5 = 49,hp = 33
    m_hp: 165
    m_attack: 85
    m_defense: 245
    # 综合战力(atk*2+def+hp/10)口径 t0→t7 几何拟合:(431.5→2057.5)^(1/7) ≈ 1.25
    tier_growth: 1.25
    # —— 逐层显式表(docs 21 阻力 #3 根治)——
    # 每馆 ace 等级(pokered)× 图鉴种族值(Pokédex),能力值直抄 ×5、零换算;
    # 锯齿形状逐格表达(atk 85→180→240→325→410→240→540→675,
    # def 245→200→155→210→540→215→400→625);
    # 行内 gold / xp 缺省 → 回退下方锚点几何
    tier_table:
      - { hp: 165, attack: 85, defense: 245 }   # Onix @14(45/160 种族)
      - { hp: 280, attack: 180, defense: 200 }  # Starmie @21(75/85)
      - { hp: 310, attack: 240, defense: 155 }  # Raichu @24(90/55)
      - { hp: 425, attack: 325, defense: 210 }  # Victreebel @29(105/65)
      - { hp: 540, attack: 410, defense: 540 }  # Weezing @43(90/120)
      - { hp: 500, attack: 240, defense: 215 }  # Alakazam @43(50/45)
      - { hp: 705, attack: 540, defense: 400 }  # Arcanine @47(110/80)
      - { hp: 825, attack: 675, defense: 625 }  # Rhydon @50(130/120)
    # 首馆奖金 ¥1,400(RB),1:1 锚定(消费环是假设层,不缩放)
    reward_gold: 1400
    # Gen1 经验 yield = floor(base_exp × level / 7);Onix base 108 → L14 = 216,×5
    reward_xp: 1080
    # 双增长率(docs 21 阻力 #2 根治):奖金 (7000/1400)^(1/7) ≈ 1.26,
    # 经验 (1457/216)^(1/7) ≈ 1.31(首馆锚点 + 末馆端点定形,中段按几何)
    reward_gold_growth: 1.26
    reward_xp_growth: 1.31

  behavior: # 练级带节奏为假设层(阻力 #4): dungeon 让位给练级带,
    # 原作"先野外练够等级再打馆"的张力由此表达
    casual: { p_dungeon: 0.3, p_upgrade: 0.2, p_training: 0.5, sessions_frac: 0.5, sessions_int: 1 }
    core: { p_dungeon: 0.5, p_upgrade: 0.3, p_training: 0.2, sessions_frac: 0.5, sessions_int: 2 }
    whale: { p_dungeon: 0.6, p_upgrade: 0.3, p_training: 0.1, sessions_frac: 0, sessions_int: 5 }

  progression:
    # Medium Fast 曲线:升下一级需 3L²−3L+1 ≈ 3L²(Bulbapedia Experience),
    # 幂律拟合 xp_base·L^2.0;×5 与能力值同域 → 15·L²
    xp_base: 15
    xp_pow: 2.0
    # 每级增量 = B/50(HP 再 +1):HP 2.56→13,Atk 1.68→8,Def 1.56→8(×5 取整)
    level_attack_gain: 8
    level_defense_gain: 8
    level_hp_gain: 13
    # 强化链是 sandtable 消费假设层(宝可梦无金币回收环),维持默认定价
    upgrade_cost_base: 50
    upgrade_cost_num: 5
    upgrade_cost_den: 4
    upgrade_attack_gain: 2

  churn: # sandtable 假设层(卡关流失的 analog:打不动馆主 = 停滞)。
    # L1 起步后重标定(原参数按"全员 L14 开局"标定):平台期容忍上调
    # (练级期 / 后期无升级日不再按 5%/日出血),RPG 语境玩家会回头练级而非流失。
    p_base: 0.003
    p_stall: 0.02
    stall_days: 3
