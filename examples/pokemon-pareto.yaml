# 宝可梦案例寻优实验(docs 12 自动寻优,Pareto 多目标,2026-10-10 裁定):
# 约束感知非支配排序——hard 约束锁流失,双目标抬战力(power_p50 ↑)与
# 压经济产出(gold_per_player ↓)的张力交给前沿呈现,不压成加权单值。
# 成本账:population 8 × (generations 5 + 1) = 48 候选 × replicates 4 = 192 次仿真
# (与 pokemon-optimize.yaml 同账;输出 opt.json 含 front0 全前沿)。
schema_version: '1'

scenario:
  population: 10000
  duration: 30d
  seed: 12345
  population_mix: { casual: 0.6, core: 0.3, whale: 0.1 }

model:
  warrior: { attack: 30, defense: 30, hp: 60 }
  combat:
    damage_model: ratio
    ratio_k: 260
    p_hit: 0.95
    p_hit_monster: 0.95
    dmg_var: 7
    max_rounds: 32
  training:
    xp: 300
    gold: 100
  dungeon:
    tiers: 8
    m_hp: 165
    m_attack: 85
    m_defense: 245
    tier_growth: 1.25
    tier_table:
      - { hp: 165, attack: 85, defense: 245 }
      - { hp: 280, attack: 180, defense: 200 }
      - { hp: 310, attack: 240, defense: 155 }
      - { hp: 425, attack: 325, defense: 210 }
      - { hp: 540, attack: 410, defense: 540 }
      - { hp: 500, attack: 240, defense: 215 }
      - { hp: 705, attack: 540, defense: 400 }
      - { hp: 825, attack: 675, defense: 625 }
    reward_gold: 1400
    reward_xp: 1080
    reward_gold_growth: 1.26
    reward_xp_growth: 1.31
  behavior:
    casual: { p_dungeon: 0.3, p_upgrade: 0.2, p_training: 0.5, sessions_frac: 0.5, sessions_int: 1 }
    core: { p_dungeon: 0.5, p_upgrade: 0.3, p_training: 0.2, sessions_frac: 0.5, sessions_int: 2 }
    whale: { p_dungeon: 0.6, p_upgrade: 0.3, p_training: 0.1, sessions_frac: 0, sessions_int: 5 }
  progression:
    xp_base: 15
    xp_pow: 2.0
    level_attack_gain: 8
    level_defense_gain: 8
    level_hp_gain: 13
    upgrade_cost_base: 50
    upgrade_cost_num: 5
    upgrade_cost_den: 4
    upgrade_attack_gain: 2
  churn:
    p_base: 0.003
    p_stall: 0.02
    stall_days: 3

optimize:
  mode: pareto
  population: 8
  generations: 5
  elite: 2
  mutation_rate: 0.3
  mutation_scale: 0.2
  replicates: 4
  parameters:
    model.warrior.attack: { min: 20, max: 220 }
    model.dungeon.reward_gold: { min: 800, max: 2400 }
  targets:
    - metric: churn_rate
      min: 0.0
      max: 0.2
      kind: hard
  objectives:
    - metric: power_p50
      direction: maximize
    - metric: gold_per_player
      direction: minimize
