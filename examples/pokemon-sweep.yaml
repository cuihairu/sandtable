# 宝可梦案例扫描实验(docs 21):单轴 model.warrior.attack——
# "初始练度 vs 馆主曲线"的失配度;30 = yaml 基准(L1 实值 ×5,阻力 #4 根治后
# 玩家真 L1 起步,练级产出面把玩家带到首馆可战等级)。
schema_version: '1'

scenario:
  population: 10000
  duration: 30d
  seed: 12345
  population_mix: { casual: 0.6, core: 0.3, whale: 0.1 }

model:
  warrior: { attack: 30, defense: 30, hp: 60 }
  combat:
    damage_model: ratio
    ratio_k: 260
    p_hit: 0.95
    p_hit_monster: 0.95
    dmg_var: 7
    max_rounds: 32
  training:
    xp: 300
    gold: 100
  dungeon:
    tiers: 8
    m_hp: 165
    m_attack: 85
    m_defense: 245
    tier_growth: 1.25
    tier_table:
      - { hp: 165, attack: 85, defense: 245 }
      - { hp: 280, attack: 180, defense: 200 }
      - { hp: 310, attack: 240, defense: 155 }
      - { hp: 425, attack: 325, defense: 210 }
      - { hp: 540, attack: 410, defense: 540 }
      - { hp: 500, attack: 240, defense: 215 }
      - { hp: 705, attack: 540, defense: 400 }
      - { hp: 825, attack: 675, defense: 625 }
    reward_gold: 1400
    reward_xp: 1080
    reward_gold_growth: 1.26
    reward_xp_growth: 1.31
  behavior:
    casual: { p_dungeon: 0.3, p_upgrade: 0.2, p_training: 0.5, sessions_frac: 0.5, sessions_int: 1 }
    core: { p_dungeon: 0.5, p_upgrade: 0.3, p_training: 0.2, sessions_frac: 0.5, sessions_int: 2 }
    whale: { p_dungeon: 0.6, p_upgrade: 0.3, p_training: 0.1, sessions_frac: 0, sessions_int: 5 }
  progression:
    xp_base: 15
    xp_pow: 2.0
    level_attack_gain: 8
    level_defense_gain: 8
    level_hp_gain: 13
    upgrade_cost_base: 50
    upgrade_cost_num: 5
    upgrade_cost_den: 4
    upgrade_attack_gain: 2
  churn:
    p_base: 0.003
    p_stall: 0.02
    stall_days: 3

sweep:
  replicates: 4
  parameters:
    model.warrior.attack: { min: 20, max: 220, step: 40 }
  targets:
    - metric: churn_rate
      min: 0.0
      max: 0.2
      kind: hard
    - metric: retention_d7
      min: 0.9
      max: 1.0
      kind: hard
