<svg xmlns="http://www.w3.org/2000/svg" width="480" height="2320" viewBox="0 0 480 2320" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Sandtable: one kernel and its consumers</title>
<desc id="desc">Vertical version of the sandtable architecture diagram. Solid lines carry business and data flow; dashed lines carry registry lookups. One pure-Rust kernel serves the CLI, the Web workbench, the desktop shell, the Python bindings and the engine contract; every artifact stays on the user's machine.</desc>
<defs>
  <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>

<rect width="480" height="2320" fill="#fff"/>

<text x="24" y="40" font-size="24" font-weight="600">One kernel and its consumers</text>
<text x="24" y="68" font-size="17" class="sub">Local-first — no server in the loop</text>

<text x="30" y="108" font-size="18" font-weight="600" class="teal">Configuration and registries</text>

<g data-node="files">
  <rect x="30" y="126" width="420" height="112" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="156" font-size="23" font-weight="600">experiment files</text>
  <text x="48" y="182" font-size="18" class="sub">scenario · model</text>
  <text x="48" y="206" font-size="18" font-weight="500" class="sub">sweep · optimize sections</text>
  <text x="48" y="230" font-size="18" font-weight="500" class="sub">YAML in · config_hash out</text>
</g>
<g data-node="param-registry">
  <rect x="30" y="266" width="420" height="100" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="296" font-size="23" font-weight="600">param registry</text>
  <text x="48" y="322" font-size="18" class="sub">path · kind · default</text>
  <text x="48" y="346" font-size="18" font-weight="500" class="sub">56 numeric channels · CSV in/out</text>
</g>
<g data-node="kpi-registry">
  <rect x="30" y="386" width="420" height="100" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="416" font-size="23" font-weight="600">KPI registry</text>
  <text x="48" y="442" font-size="18" class="sub">8 metrics · availability</text>
  <text x="48" y="466" font-size="18" font-weight="500" class="sub">CI-based constraint verdicts</text>
</g>

<text x="30" y="522" font-size="18" font-weight="600" class="teal">Kernel — sandtable-core (pure Rust)</text>

<g data-node="kernel-sim">
  <rect x="30" y="540" width="420" height="146" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="570" font-size="23" font-weight="600">kernel · sim</text>
  <text x="48" y="596" font-size="18" class="sub">clock · event queue · event loop</text>
  <text x="48" y="620" font-size="18" font-weight="500" class="sub">behavior · combat · progression</text>
  <text x="48" y="644" font-size="18" font-weight="500" class="sub">churn · gacha · loot</text>
  <text x="48" y="668" font-size="18" font-weight="500" class="sub">online stats · formulas · keyed RNG</text>
</g>
<g data-node="pipeline">
  <rect x="30" y="742" width="420" height="146" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="772" font-size="23" font-weight="600">experiment pipeline</text>
  <text x="48" y="798" font-size="18" class="sub">replicates · CRN pairs</text>
  <text x="48" y="822" font-size="18" font-weight="500" class="sub">grid / random sweep · OAT</text>
  <text x="48" y="846" font-size="18" font-weight="500" class="sub">recommendation · CI verdicts</text>
  <text x="48" y="870" font-size="18" font-weight="500" class="sub">reads: axes &amp; KPI targets</text>
</g>
<g data-node="search-surrogate">
  <rect x="30" y="932" width="420" height="124" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="962" font-size="23" font-weight="600">search &amp; surrogate</text>
  <text x="48" y="988" font-size="18" class="sub">evolutionary + Pareto</text>
  <text x="48" y="1012" font-size="18" font-weight="500" class="sub">random-forest surrogate (read-only)</text>
  <text x="48" y="1036" font-size="18" font-weight="500" class="sub">χ² disttest data plane</text>
</g>

<text x="30" y="1092" font-size="18" font-weight="600" class="teal">Shells — every one links the same kernel</text>

<g data-node="cli">
  <rect x="30" y="1110" width="420" height="124" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="1140" font-size="22" font-weight="600">sandtable-cli</text>
  <text x="48" y="1166" font-size="18" class="sub">12 subcommands</text>
  <text x="48" y="1190" font-size="18" font-weight="500" class="sub">report.html · .sandtable archive</text>
  <text x="48" y="1214" font-size="18" font-weight="500" class="sub">params CSV · duckdb query</text>
</g>
<g data-node="wasm">
  <rect x="30" y="1258" width="420" height="100" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="1288" font-size="22" font-weight="600">sandtable-wasm</text>
  <text x="48" y="1314" font-size="18" class="sub">wasm-bindgen</text>
  <text x="48" y="1338" font-size="18" font-weight="500" class="sub">thin JSON-shaped bindings</text>
</g>
<g data-node="python">
  <rect x="30" y="1382" width="420" height="100" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="1412" font-size="22" font-weight="600">sandtable-python</text>
  <text x="48" y="1438" font-size="18" class="sub">pyo3 · maturin</text>
  <text x="48" y="1462" font-size="18" font-weight="500" class="sub">run · sweep · day hook</text>
</g>
<g data-node="engine">
  <rect x="30" y="1506" width="420" height="100" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="1536" font-size="22" font-weight="600">sandtable-engine</text>
  <text x="48" y="1562" font-size="18" class="sub">.engine.json contract</text>
  <text x="48" y="1586" font-size="18" font-weight="500" class="sub">export · import · backflow</text>
</g>
<g data-node="desktop">
  <rect x="30" y="1630" width="420" height="100" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="1660" font-size="22" font-weight="600">sandtable-desktop</text>
  <text x="48" y="1686" font-size="18" class="sub">Tauri 2 · 13 native commands</text>
  <text x="48" y="1710" font-size="18" font-weight="500" class="sub">same workbench UI · native DuckDB</text>
</g>

<text x="30" y="1766" font-size="18" font-weight="600" class="teal">Applications and analytics</text>

<g data-node="web">
  <rect x="30" y="1784" width="420" height="142" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="1814" font-size="22" font-weight="600">apps/web workbench</text>
  <text x="48" y="1840" font-size="18" class="sub">5 workspaces</text>
  <text x="48" y="1864" font-size="18" font-weight="500" class="sub">sweep candidates in a Web Worker</text>
  <text x="48" y="1888" font-size="18" font-weight="500" class="sub">param grid · apply via registry</text>
  <text x="48" y="1912" font-size="18" font-weight="500" class="sub">DuckDB-Wasm (local)</text>
</g>
<g data-node="templates">
  <rect x="30" y="1950" width="420" height="100" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="48" y="1980" font-size="22" font-weight="600">scripts/templates</text>
  <text x="48" y="2006" font-size="18" class="sub">batch_sweep · ab_summary · sweep_curves</text>
  <text x="48" y="2030" font-size="18" font-weight="500" class="sub">via the pyo3 bindings</text>
</g>
<g data-node="external-engine">
  <rect x="30" y="2074" width="420" height="100" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
  <text x="48" y="2104" font-size="22" font-weight="600">game engine</text>
  <text x="48" y="2130" font-size="18" class="sub">external consumer · .engine.json</text>
  <text x="48" y="2154" font-size="18" font-weight="500" class="sub">backflow · config_hash A/B</text>
</g>

<g data-node="artifacts">
  <path d="M30 2222 A95.0 13 0 0 1 220 2222 V2283 A95.0 13 0 0 1 30 2283 Z" fill="#f5f7fa" stroke="#ced8e5" stroke-width="1.3"/>
  <ellipse cx="125.0" cy="2222" rx="95.0" ry="13" fill="#eef2f7" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="125" y="2240" text-anchor="middle" font-size="20" font-weight="600">Local artifacts</text>
  <text x="125" y="2264" text-anchor="middle" font-size="16" class="sub">CSV · JSON · Parquet</text>
  <text x="125" y="2286" text-anchor="middle" font-size="16" class="sub">HTML</text>
</g>
<text x="232" y="2251" font-size="18" class="sub">Solid: business / data</text>
<text x="232" y="2278" font-size="18" class="sub">Dashed: registry lookups</text>

