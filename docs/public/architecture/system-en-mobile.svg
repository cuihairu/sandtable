<path d="M240 686 L240 742" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="250" y="698" width="150" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
