<path d="M240 888 L240 932" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#blue)" marker-end="url(#blue)"/>
<rect x="250" y="896" width="130" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="315" y="914" text-anchor="middle" font-size="18" font-weight="500" class="blue">candidates</text>

<path d="M450 316 L470 316 L470 810 L450 810" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#teal)"/>

</svg>
