  <text x="950" y="374" font-size="23" font-weight="600">寻优与代理</text>
  <text x="950" y="398" font-size="17" class="sub">进化 + Pareto</text>
  <text x="950" y="419" font-size="14" font-weight="500" class="sub">随机森林代理(只读)</text>
  <text x="950" y="437" font-size="14" font-weight="500" class="sub">χ² 分布检验数据面</text>
</g>

