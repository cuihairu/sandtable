  <rect x="48" y="154" width="280" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="66" y="182" font-size="23" font-weight="600">实验文件</text>
  <text x="66" y="206" font-size="17" class="sub">scenario · model</text>
  <text x="66" y="228" font-size="14" font-weight="500" class="sub">sweep · optimize 配置段</text>
  <text x="66" y="246" font-size="14" font-weight="500" class="sub">YAML 进 · config_hash 出</text>
</g>
<g data-node="param-registry">
  <rect x="420" y="154" width="300" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="438" y="187" font-size="23" font-weight="600">参数注册表</text>
  <text x="438" y="214" font-size="17" class="sub">path · kind · default</text>
  <text x="438" y="236" font-size="14" font-weight="500" class="sub">56 个数值通道 · CSV 进出</text>
</g>
<g data-node="kpi-registry">
  <rect x="830" y="154" width="280" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="848" y="187" font-size="23" font-weight="600">KPI 注册表</text>
  <text x="848" y="214" font-size="17" class="sub">8 项指标 · 可用性</text>
  <text x="848" y="236" font-size="14" font-weight="500" class="sub">基于 CI 的约束判定</text>
</g>

<rect x="28" y="300" width="1224" height="170" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="328" font-size="17" font-weight="600">内核 —— sandtable-core(纯 Rust · wasm32 编译是 CI 门禁)</text>

<g data-node="kernel-sim">
  <rect x="48" y="346" width="360" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="66" y="374" font-size="23" font-weight="600">内核 · 仿真</text>
  <text x="66" y="398" font-size="17" class="sub">时钟 · 事件队列 · 事件循环</text>
  <text x="66" y="419" font-size="14" font-weight="500" class="sub">行为 · 战斗 · 成长 · 流失 · 抽卡 · 掉落</text>
  <text x="66" y="437" font-size="14" font-weight="500" class="sub">在线统计 · 公式求值 · 带键随机数</text>
</g>
