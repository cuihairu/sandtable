  <text x="518" y="398" font-size="17" class="sub">replicates · CRN 配对</text>
  <text x="518" y="419" font-size="14" font-weight="500" class="sub">grid / random 扫描 · OAT 敏感性</text>
  <text x="518" y="437" font-size="14" font-weight="500" class="sub">单轴推荐</text>
</g>
<g data-node="search-surrogate">
