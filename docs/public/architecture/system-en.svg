  <text x="66" y="572" font-size="20" font-weight="600">sandtable-cli</text>
  <text x="66" y="596" font-size="17" class="sub">12 subcommands</text>
  <text x="66" y="617" font-size="14" font-weight="500" class="sub">report.html · .sandtable</text>
  <text x="66" y="635" font-size="14" font-weight="500" class="sub">params CSV · duckdb query</text>
</g>
