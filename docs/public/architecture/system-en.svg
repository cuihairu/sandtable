  <text x="296" y="604" font-size="17" class="sub">wasm-bindgen</text>
  <text x="296" y="626" font-size="14" font-weight="500" class="sub">thin JSON-shaped bindings</text>
</g>
<g data-node="python">
  <rect x="508" y="544" width="210" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="526" y="577" font-size="20" font-weight="600">sandtable-python</text>
  <text x="526" y="604" font-size="17" class="sub">pyo3 · maturin</text>
  <text x="526" y="626" font-size="14" font-weight="500" class="sub">run · sweep · day hook</text>
</g>
<g data-node="engine">
  <rect x="738" y="544" width="210" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="756" y="577" font-size="20" font-weight="600">sandtable-engine</text>
  <text x="756" y="604" font-size="17" class="sub">.engine.json</text>
  <text x="756" y="626" font-size="14" font-weight="500" class="sub">export · import · backflow</text>
</g>
<g data-node="desktop">
  <rect x="968" y="544" width="262" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="986" y="572" font-size="22" font-weight="600">sandtable-desktop</text>
  <text x="986" y="596" font-size="17" class="sub">Tauri 2 · 13 commands</text>
  <text x="986" y="617" font-size="14" font-weight="500" class="sub">same workbench UI · no wasm</text>
  <text x="986" y="635" font-size="14" font-weight="500" class="sub">native DuckDB query</text>
</g>

