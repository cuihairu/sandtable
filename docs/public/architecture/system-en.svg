<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Sandtable: one kernel and its consumers</title>
<desc id="desc">Color-block diagram of the sandtable crate layout and data flow. Solid lines carry business and data flow; dashed lines carry registry lookups. One pure-Rust kernel serves the CLI, the Web workbench, the desktop shell, the Python bindings and the engine contract; every artifact stays on the user's machine.</desc>
<defs>
  <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>

<rect width="1280" height="840" fill="#fff"/>

<text x="28" y="40" font-size="27" font-weight="600">One kernel and its consumers</text>
<path d="M820 31 L866 31" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="878" y="37" font-size="16" class="sub">Business / data</text>
<path d="M1054 31 L1100 31" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#teal)"/>
<text x="1112" y="37" font-size="16" class="sub">Registry lookups</text>
<text x="28" y="75" font-size="17" class="sub">Local-first: simulation, analytics and artifacts stay on the user's machine — no server in the loop.</text>

<rect x="28" y="106" width="1224" height="170" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="134" font-size="17" font-weight="600" class="teal">Configuration and registries</text>

<g data-node="files">
  <rect x="48" y="154" width="280" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="66" y="182" font-size="23" font-weight="600">experiment files</text>
  <text x="66" y="206" font-size="17" class="sub">scenario · model</text>
  <text x="66" y="228" font-size="14" font-weight="500" class="sub">sweep · optimize sections</text>
  <text x="66" y="246" font-size="14" font-weight="500" class="sub">YAML in · config_hash out</text>
</g>
<g data-node="param-registry">
  <rect x="420" y="154" width="300" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="438" y="187" font-size="23" font-weight="600">param registry</text>
  <text x="438" y="214" font-size="17" class="sub">path · kind · default</text>
  <text x="438" y="236" font-size="14" font-weight="500" class="sub">56 numeric channels · CSV in/out</text>
</g>
<g data-node="kpi-registry">
  <rect x="830" y="154" width="280" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="848" y="187" font-size="23" font-weight="600">KPI registry</text>
  <text x="848" y="214" font-size="17" class="sub">8 metrics · availability</text>
  <text x="848" y="236" font-size="14" font-weight="500" class="sub">CI-based constraint verdicts</text>
</g>

<rect x="28" y="300" width="1224" height="170" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="328" font-size="17" font-weight="600">Kernel — sandtable-core (pure Rust · wasm32 build is a CI gate)</text>

<g data-node="kernel-sim">
  <rect x="48" y="346" width="360" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="66" y="374" font-size="23" font-weight="600">kernel · sim</text>
  <text x="66" y="398" font-size="17" class="sub">clock · event queue · event loop</text>
  <text x="66" y="419" font-size="14" font-weight="500" class="sub">behavior · combat · progression · churn · gacha</text>
  <text x="66" y="437" font-size="14" font-weight="500" class="sub">online stats · formulas · keyed RNG</text>
</g>
<g data-node="pipeline">
  <rect x="500" y="346" width="340" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="518" y="374" font-size="23" font-weight="600">experiment pipeline</text>
  <text x="518" y="398" font-size="17" class="sub">replicates · CRN pairs</text>
  <text x="518" y="419" font-size="14" font-weight="500" class="sub">grid / random sweep · OAT sensitivity</text>
  <text x="518" y="437" font-size="14" font-weight="500" class="sub">single-axis recommendation</text>
</g>
<g data-node="search-surrogate">
  <rect x="932" y="346" width="300" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
  <text x="950" y="374" font-size="23" font-weight="600">search &amp; surrogate</text>
  <text x="950" y="398" font-size="17" class="sub">evolutionary + Pareto</text>
  <text x="950" y="419" font-size="14" font-weight="500" class="sub">random-forest surrogate (read-only)</text>
  <text x="950" y="437" font-size="14" font-weight="500" class="sub">χ² disttest data plane</text>
</g>

<rect x="28" y="494" width="1224" height="318" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="522" font-size="17" font-weight="600" class="teal">Shells, applications and analytics</text>

<g data-node="cli">
