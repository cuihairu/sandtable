  <text x="48" y="2006" font-size="18" class="sub">batch_sweep · ab_summary · sweep_curves</text>
  <text x="48" y="2030" font-size="18" font-weight="500" class="sub">经 pyo3 绑定调用</text>
</g>
<g data-node="external-engine">
  <rect x="30" y="2074" width="420" height="100" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
  <text x="48" y="2104" font-size="22" font-weight="600">游戏引擎</text>
  <text x="48" y="2130" font-size="18" class="sub">外部消费方 · .engine.json</text>
  <text x="48" y="2154" font-size="18" font-weight="500" class="sub">回流 · config_hash A/B</text>
</g>

