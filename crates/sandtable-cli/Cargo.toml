[package]
name = "sandtable-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandtable 命令行"

[[bin]]
name = "sandtable"
path = "src/main.rs"

[dependencies]
sandtable-core = { path = "../sandtable-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip:写盘再读回的 f64 逐位一致(默认解析器个别值差 1 ulp,曾破坏 web 等价验收)
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"
# 候选间并行(文档 11 章);core 保持无 rayon,并行只在壳层
rayon = "1"
# Parquet 载体(文档 09 章):以 feature 提供,默认构建不含
parquet = { version = "59.3", default-features = false, features = ["arrow"], optional = true }
# DuckDB 分析层(文档 09 章:只读结果数据集,不进仿真路径),feature 提供
duckdb = { version = "1", default-features = false, features = ["bundled", "parquet"], optional = true }
# 项目打包(文档 09 章):.sandtable 归档,只开 deflate,不背多余编码
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[features]
parquet = ["dep:parquet", "sandtable-core/arrow"]
duckdb = ["dep:duckdb"]

[dev-dependencies]
arrow = { version = "59.3", default-features = false }
# 项目打包测试:手工构造篡改归档(哈希不匹配 / 路径纪律)
zip = { version = "2", default-features = false, features = ["deflate"] }
# Web 等价测试:直接调绑定层的 native 转发(文档 18 章 Phase 6 验收)
sandtable-wasm = { path = "../sandtable-wasm" }
