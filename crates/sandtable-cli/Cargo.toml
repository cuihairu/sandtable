[package]
name = "sandtable-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandtable 命令行"

[[bin]]
name = "sandtable"
path = "src/main.rs"

[dependencies]
sandtable-core = { path = "../sandtable-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
# 候选间并行(文档 11 章);core 保持无 rayon,并行只在壳层
rayon = "1"
# Parquet 载体(文档 09 章):以 feature 提供,默认构建不含
parquet = { version = "54", default-features = false, features = ["arrow"], optional = true }

[features]
parquet = ["dep:parquet", "sandtable-core/arrow"]

[dev-dependencies]
arrow = { version = "54", default-features = false }
