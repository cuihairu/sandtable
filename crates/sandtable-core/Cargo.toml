[package]
name = "sandtable-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandtable 仿真内核:配置编译、带键随机数、离散事件仿真、在线聚合指标与实验编排"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip:写盘再读回的 f64 逐位一致(默认解析器个别值差 1 ulp,曾破坏 web 等价验收)
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
thiserror = "2"
# Arrow 数据契约(文档 09 章):RecordBatch 构建以 feature 提供,默认构建不含
arrow = { version = "59.3", default-features = false, optional = true }

[features]
arrow = ["dep:arrow"]
