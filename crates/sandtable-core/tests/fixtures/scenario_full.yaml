schema_version: "1"

scenario:
  population: 10000
  duration: "30d"
  population_mix:
    casual: 0.60
    core: 0.30
    whale: 0.10
  seed: 12345

model:
  warrior:
    attack: 100
    defense: 80
    hp: 1000
  whale_gain_mult: 2

  combat:
    p_hit: 0.85
    p_hit_monster: 0.85
    dmg_var: 10
    max_rounds: 32

  dungeon:
    tiers: 8
    m_hp: 300
    m_attack: 45
    m_defense: 20
    tier_growth: 1.5
    reward_gold: 40
    reward_xp: 45
    reward_gold_growth: 1.4
    reward_xp_growth: 1.4

  behavior:
    casual: { sessions_int: 1, sessions_frac: 0.5, p_dungeon: 0.7, p_upgrade: 0.2 }
    core:   { sessions_int: 2, sessions_frac: 0.5, p_dungeon: 0.6, p_upgrade: 0.3 }
    whale:  { sessions_int: 5, sessions_frac: 0.0, p_dungeon: 0.65, p_upgrade: 0.3 }

  progression:
    xp_base: 60
    xp_pow: 1.3
    level_attack_gain: 5
    level_defense_gain: 3
    level_hp_gain: 50
    upgrade_cost_base: 50
    upgrade_cost_num: 5
    upgrade_cost_den: 4
    upgrade_attack_gain: 2

  formulas:
    xp_needed: "xp_base * level ^ xp_pow"

  churn:
    p_base: 0.003
    p_stall: 0.05
    stall_days: 2
