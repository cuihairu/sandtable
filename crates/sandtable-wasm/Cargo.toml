[package]
name = "sandtable-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandtable WebAssembly 薄绑定"

[lib]
# cdylib:wasm-pack 产物;rlib:native 测试与 CLI 等价测试直接调用原生函数
crate-type = ["cdylib", "rlib"]

[dependencies]
sandtable-core = { path = "../sandtable-core" }
wasm-bindgen = "0.2"
# float_roundtrip:写盘再读回的 f64 逐位一致(默认解析器个别值差 1 ulp,曾破坏 web 等价验收)
serde_json = { version = "1", features = ["float_roundtrip"] }
