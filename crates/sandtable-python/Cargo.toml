[package]
name = "sandtable-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandtable 的 Python 绑定(脚本层阶段 1:方案 B 扩展模块)"

[lib]
# cdylib 供 maturin 出 wheel;rlib 供 cargo test(--workspace)在本机/CI 直跑单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
sandtable-core = { path = "../sandtable-core" }
# float_roundtrip:写盘再读回的 f64 逐位一致(默认解析器个别值差 1 ulp,曾破坏 web 等价验收)
serde_json = { version = "1", features = ["float_roundtrip"] }
# Python 绑定(脚本层阶段 1,scripts/scripting-design.md):独立壳层 crate,
# core 依赖树保持无平台库(docs 04 边界,wasm32 门不受影响)
pyo3 = "0.29"
